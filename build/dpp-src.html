<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFFFF">
<title>이든 제품 정보</title>
<style>
/*FONT_FACE*/
/* 이든 DPP 소비자 화면. 브랜드 페이지(index.html)와 같은 토큰: 흰 바탕, 짙은 초록 #193B2A 하나, Pretendard.
   데이터 출처: 「DPP 제품정보 — 프레그런스 우선 작성본 20261027 - 힐스테이트_HB03_50mL」의 공개 범위 '소비자' 항목만 사용. */
:root{
  --canvas:#FFFFFF; --surface:#FFFFFF; --sand:#EEF0E9; --stage:#F6F5F6; --ink:#172A20; --stone:#4E5A53; --ash:#66716A;
  --hairline:#E4E7E1; --forest:#193B2A; --on-forest:#F1F5EF; --on-forest-2:#B9CBBE;
  --font:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scrollbar-color:#D3D9D2 var(--canvas)}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
::selection{background:#DCE7DD;color:var(--ink)}
:focus-visible{outline:2px solid var(--forest);outline-offset:3px}
a{color:inherit;text-underline-offset:3px}
img{display:block;max-width:100%}
h1,h2,h3{text-wrap:balance} p{text-wrap:pretty}
.app{max-width:480px;margin:0 auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* 헤더 */
.hdr{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;height:56px;background:var(--canvas)}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;text-decoration:none;font-size:15px;font-weight:600;color:var(--stone)}
.back svg{transition:transform 200ms var(--ease-out)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--forest);background:var(--sand);border-radius:999px;padding:6px 12px}

/* 상단 제품 */
.stage{background:var(--stage);aspect-ratio:1/1;overflow:hidden}
.stage img{width:100%;height:100%;object-fit:cover}
.title{padding-block:24px 4px}
.title h1{margin:0;font-size:30px;line-height:1.28;font-weight:600;letter-spacing:-.035em}
.title .variant{margin:6px 0 0;font-size:17px;font-weight:500;color:var(--stone)}
.title .line{margin:12px 0 0;display:inline-flex;font-size:13px;font-weight:600;color:var(--forest);border:1px solid var(--hairline);border-radius:999px;padding:4px 12px}
.mood{margin:20px 0 0;font-size:21px;line-height:1.5;font-weight:300;letter-spacing:-.025em;color:var(--ink)}
.desc{margin:10px 0 0;color:var(--stone)}

/* 목차 */
.idx{margin-top:24px;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline)}
.idx button{appearance:none;background:none;border:0;border-left:1px solid var(--hairline);padding:12px 4px 12px 10px;min-height:56px;text-align:left;font:600 14px/1.3 var(--font);letter-spacing:-.02em;color:var(--ink);cursor:pointer;min-width:0}
.idx button:first-child{border-left:0;padding-left:0}
.idx span{display:block;font-size:12px;font-weight:600;color:var(--ash);margin-bottom:2px}
.idx button:active{color:var(--forest)}

/* 섹션 */
.sec{padding-block:48px 0}
.sec h2[id]{scroll-margin-top:72px}
.sec h2{margin:0 0 16px;font-size:22px;line-height:1.36;font-weight:600;letter-spacing:-.03em;display:flex;align-items:baseline;gap:10px}
.sec h2 .no{font-size:14px;font-weight:600;color:var(--forest);letter-spacing:0}
.sec p{margin:0;color:var(--stone)}
.sec .lead{margin-bottom:16px}
.mood .coll{display:block;margin-top:6px;font-size:14px;font-weight:500;letter-spacing:-.01em;color:var(--forest)}
.sec p.fine{margin-top:14px;font-size:13px;line-height:1.6;color:var(--ash)}
.sec .tag{margin:-6px 0 12px;font-size:17px;font-weight:500;color:var(--forest);letter-spacing:-.01em}
.sec .tag ~ p + p{margin-top:10px}
.foot .fnote{margin:0 0 12px}
.tbd{color:var(--ash);font-weight:400}

/* 원료 출처 */
.origin{border-radius:24px;background:var(--forest);color:var(--on-forest);padding:22px 20px}
.origin .place{display:flex;gap:10px;align-items:flex-start}
.origin .place svg{flex:none;margin-top:3px;color:var(--on-forest-2)}
.origin strong{display:block;font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.4}
.origin small{display:block;font-size:13.5px;color:var(--on-forest-2);margin-top:2px}
.origin .mat{margin-top:16px;padding-top:14px;border-top:1px solid rgba(241,245,239,.18);display:flex;justify-content:space-between;gap:12px;font-size:14px}
.origin .mat span:first-child{color:var(--on-forest-2)}
.origin .mat span:last-child{font-weight:600;text-align:right}
.origin p{margin:14px 0 0;color:var(--on-forest);font-size:15px;line-height:1.7}

/* 리추얼 */
.ritual{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ritual li{border:1px solid var(--hairline);border-radius:16px;padding:12px 12px 14px;min-width:0}
.ritual .n{font-size:12px;font-weight:600;color:var(--ash)}
.ritual strong{display:block;font-size:15px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.ritual small{display:block;font-size:12.5px;color:var(--ash)}
.ritual li.on{background:var(--forest);border-color:var(--forest)}
.ritual li.on .n,.ritual li.on small{color:var(--on-forest-2)}
.ritual li.on strong{color:var(--on-forest)}

/* 캡 이야기 */
.cap{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.cap div{background:var(--sand);border-radius:16px;padding:14px}
.cap dt{font-size:12.5px;color:var(--stone)}
.cap dd{margin:2px 0 0;font-size:15px;font-weight:600;letter-spacing:-.02em;line-height:1.4}
.cap dd small{display:block;font-size:12.5px;font-weight:400;color:var(--stone);margin-top:2px}
.cap .wide{grid-column:1 / -1}
.origin + .cap,.lead + .cap{margin-top:0}
.full{margin-top:12px;border:1px solid var(--hairline);border-radius:16px;padding:0 16px}
.full summary{min-height:48px;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;cursor:pointer;list-style:none}
.full summary::-webkit-details-marker{display:none}
.full summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--stone);border-bottom:2px solid var(--stone);transform:rotate(45deg) translateY(-2px);transition:transform 200ms var(--ease-out)}
.full[open] summary::after{transform:rotate(225deg) translateY(-2px)}
.full p{padding-bottom:16px;font-size:14px;line-height:1.75}
.sub{margin:24px 0 8px;font-size:16px;font-weight:600;letter-spacing:-.02em}
.caution{margin:0;padding-left:20px;color:var(--stone);font-size:14.5px;line-height:1.7}
.caution li+li{margin-top:6px}

/* 제품 정보 표 */
.spec{margin:0;border-top:1px solid var(--ink)}
.spec div{display:grid;grid-template-columns:108px 1fr;gap:12px;padding:13px 0;border-bottom:1px solid var(--hairline)}
.spec dt{font-size:14px;color:var(--ash)}
.spec dd{margin:0;font-size:15px;font-weight:500;line-height:1.5;min-width:0}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.02em}

/* 준비 중 */
.pending{margin-top:16px;border-radius:16px;border:1px dashed #C9D1CA;padding:14px 16px;font-size:14px;color:var(--stone)}
.sec p.pending{color:var(--stone)}

/* 문의 구매 */
.buy{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:999px;text-decoration:none;font-size:16px;font-weight:600;transition:transform 160ms var(--ease-out),background-color 200ms ease}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--forest);color:#FFFFFF}
.btn.sec2{border:1px solid var(--hairline);color:var(--ink);background:var(--surface)}
.mail{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 0;font-size:14px;color:var(--stone)}
.copy{appearance:none;border:1px solid var(--hairline);background:var(--surface);color:var(--ink);border-radius:999px;height:36px;padding:0 14px;font:600 13px var(--font);cursor:pointer;transition:transform 160ms var(--ease-out)}
.copy:active{transform:scale(.96)}

/* 같은 라인 */
.others{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px}
.others a{text-decoration:none;min-width:0}
.others img{aspect-ratio:1/1;width:100%;height:auto;object-fit:cover;border-radius:16px;background:var(--stage);transition:transform 300ms var(--ease-out)}
.others span{display:block;margin-top:8px;font-size:13px;font-weight:600;line-height:1.35;letter-spacing:-.02em}
.others small{display:block;font-size:12px;color:var(--ash);font-weight:500}

/* 선택 화면 */
.choose h1{margin:8px 0 6px;font-size:26px;line-height:1.3;font-weight:300;letter-spacing:-.03em}
.choose h1 b{font-weight:600}
.choose > p{margin:0 0 20px;color:var(--stone)}
.list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:18px 12px}
.list a{text-decoration:none;display:block}
.list img{aspect-ratio:1/1;width:100%;height:auto;object-fit:cover;border-radius:20px;background:var(--stage);transition:transform 300ms var(--ease-out)}
.list strong{display:block;margin-top:10px;font-size:15px;font-weight:600;letter-spacing:-.02em;line-height:1.35}
.list small{display:block;font-size:13px;color:var(--ash)}

.foot{padding-block:40px 0;font-size:12.5px;line-height:1.6;color:var(--ash)}
.foot b{color:var(--stone);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;padding:10px 16px;border-radius:12px;background:var(--ink);color:#FFFFFF;font-size:14px;transition:opacity 200ms var(--ease-out),transform 200ms var(--ease-out)}
@starting-style{.toast{opacity:0;transform:translate(-50%,8px)}}

@media (hover:hover) and (pointer:fine){
  .back:hover svg{transform:translateX(-2px)}
  .others a:hover img,.list a:hover img{transform:scale(1.03)}
  .btn.sec2:hover{background:var(--sand)}
  .idx button:hover{color:var(--forest)}
}
@media (prefers-reduced-motion: reduce){*{transition-duration:0ms!important}}
</style>
</head>
<body>
<div class="app">
  <header class="hdr gut">
    <a class="back" href="index.html" aria-label="이든 브랜드 이야기로 돌아가기">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>이든 이야기
    </a>
    <span class="badge"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>디지털 제품 여권</span>
  </header>
  <main id="view" aria-live="polite"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* 제품 데이터. 공개 범위 '소비자' 항목과, 이미 공개된 브랜드 자료(idden.co, 브랜드 소개 페이지)만 씀.
   pending: 확인이 끝나면 추가할 소비자 항목. 값을 추측해서 채우지 않음. */
var COMMON = {
  brand: "이든 (Idden)",
  seller: "서스테이너블랩 주식회사",
  line: "HB03 Bitter Summer",
  buy: "https://idden.co/",
  email: "hello@idden.co",
  asOf: "2026년 10월 28일",
  /* 아래 세 값은 브랜드 자료 「Idden _ K-Wellness Beauty · Brand & Collection 2026」에서 가져옴 */
  collection: "하루의 속도를 늦추는 순간을 떠올리는 green garden 컬렉션입니다.",
  brandText: ["이든은 샤워에서 보습, 향으로 이어지는 일상의 시간을 제안하는 한국의 웰니스 뷰티 브랜드입니다. 자연에서 영감받은 향과 간결한 3-step 리추얼로, 여행지에서 경험한 편안함을 집에서도 이어갑니다.",
              "그 감각의 바탕에는 버려지는 식물 자원을 뷰티 원료와 소재로 다시 활용하는 서스테이너블랩의 기술이 있습니다."],
  sameLineNote: "제품별 원료와 향의 구성은 다릅니다. 컬렉션의 식물 이야기가 모든 제품의 동일 성분을 의미하지는 않습니다.",
  ritualText: "씻고, 보습하고, 향으로 마무리하는 일상. 자연의 한 장면을 떠올리게 하는 향으로 그날의 리추얼을 완성합니다.",
  origin: {
    place: "푸르메소셜팜",
    where: "경기도 여주시, 푸르메재단 연계 스마트팜",
    text: "푸르메소셜팜은 발달장애 청년들이 토마토를 재배하며 일하는 스마트팜입니다. 이곳에서 나오는 토마토 부산물을 새로운 자원으로 활용하는 이야기를 담습니다."

/* 화면 순서: 제품 소개 → 01 기본 정보 → 02 원료와 성분 → 03 포장 → 04 사용 → 문의 → 다른 제품.
   한 사실은 한 곳에만 씀. 값이 없는 소비자 항목은 그 자리에 '확인 후 공개'로 둠(추측해서 채우지 않음). */
var TBD = null;
var FRAG_TYPE = "안전확인대상생활화학제품<br>방향제(분사형·분무기형)";

   관계자 항목은 쓰지 않음. 소비자 항목인데 값이 비어 있으면 TBD(확인 후 공개). */
var PRODUCTS = [
  {
    id: "hb03-fragrance-hillstate-50", step: 3,
    name: "이든 에이치 프레그런스", variant: "50mL · 힐스테이트",
    photo: "img/dpp/hb03-fragrance-hillstate-50.jpg", thumb: "img/dpp/hb03-fragrance-hillstate-50-s.jpg",
    alt: "힐스테이트 Bitter Summer by Idden 프레그런스 병과 우드 톤 캡",

    pack: CAP, use: null

    basics: [["제품 유형", FRAG_TYPE], ["내용량", "30mL"], ["라인", COMMON.line], ["브랜드", COMMON.brand],
             ["바코드", "<span class=\"mono\">8809821110507</span>"]],
    origin: { lead: "이 향의 원료는 토마토 농장에서 나온 부산물에서 출발했습니다.", card: true, material: "토마토 부산물" },
    pack: CAP, use: null
  },
  {

    alt: "힐스테이트 바디 로션 HB03 Bitter Summer by Idden 펌프 용기",

    desc: "샤워 후 피부에 보습과 향을 더하는 바디케어. 씻는 순간에서 피부에 남는 감각까지 경험을 이어갑니다.",

  {

    name: "이든 얼스바", variant: "HB03 Bitter Summer",

    mood: "해 질 무렵 정원, 토마토 줄기의 초록빛 향.",
    desc: "고체 클렌저로 시작하는 샤워 리추얼. 두피와 머리카락, 온몸을 하나로 씻는 올인원 세정바입니다.",
    basics: [["제품 유형", "화장품, 올인원 고체 세정바"], ["내용량", "100g(건조 전)<br>80g(건조 후)"], ["사용기한", "개봉 후 6개월 이내 사용 권장"], ["라인", COMMON.line], ["브랜드", COMMON.brand],
             ["바코드", "<span class=\"mono\">8809821110132</span>"], ["책임판매업자", "서스테이너블랩(주)"], ["제조사", "어니스트버디(주)"], ["제조 공장", "경기도 김포시"]],
    origin: { lead: "토마토박가루와 토마토추출물을 주원료로 담았습니다.", card: false,
              main: ["토마토박가루", "토마토추출물"],
              full: "소듐코코일이세티오네이트, 옥수수전분, 정제수, 글리세린, 코코넛애씨드, 데실글루코사이드, C10-16알킬글루코사이드, 소듐이세티오네이트, 향료, 토마토박가루, 스테아릭애씨드, 베헨트라이모늄메토설페이트, 세틸알코올, 올리브오일, 해바라기씨오일, 테트라소듐글루타메이트다이아세테이트, 적색산화철, 포도씨오일, 약모밀추출물, 병풀추출물, 토마토추출물, 마이카, 티타늄디옥사이드, 시어버터, 나이아신아마이드, 숯가루, 틴옥사이드, 판테놀, 1,2-헥산다이올, 부틸렌글라이콜, 시트로넬올, 리모넨" },
    pack: { text: "얼스바는 플라스틱 용기 대신 부직포 파우치와 종이 단상자에 담깁니다.",
            items: [["1차 포장", "부직포 파우치", ""], ["2차 포장", "종이 단상자", "인바이런먼트 문록 지류, 미색 인쇄"]],
            marks: "PETA ANIMAL TEST-FREE, VEGAN 마크" },
    use: { how: "본품에 물을 묻혀 거품을 내어 두피와 머리카락 그리고 온몸에 마사지하듯 부드럽게 문지른 후 깨끗이 헹궈주세요.",
           caution: ["화장품 사용 시 또는 사용 후 직사광선에 의하여 사용부위가 붉은 반점, 부어오름 또는 가려움증 등의 이상 증상이나 부작용이 있는 경우에는 전문의 등과 상담할 것",
                     "상처가 있는 부위 등에는 사용을 자제할 것",
                     "어린이의 손이 닿지 않는 곳에 보관할 것",
                     "직사광선을 피해서 보관할 것",
                     "눈에 들어갔을 때에는 즉시 씻어낼 것"] }
  }
];
var STEPS = [["1", "Cleanse", "씻기"], ["2", "Nourish", "보습"], ["3", "Fragrance", "향"]];

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
var pin = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
var arrow = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>';
var tbdCell = '<span class="tbd">확인 후 공개</span>';

function secHead(no, id, title){ return '<h2 id="' + id + '"><span class="no">' + no + '</span>' + title + '</h2>'; }
function note(text){ return '<p class="pending">' + esc(text) + '</p>'; }

function productView(p){
  var o = COMMON.origin, h = [];
  var secs = [["d-basic", "기본 정보"], ["d-origin", "원료와 성분"], ["d-pack", "포장"], ["d-use", "사용"]];
  /* 제품 소개 */
  h.push('<div class="stage"><img src="' + p.photo + '" alt="' + esc(p.alt) + '" width="1200" height="1200"></div>');
  h.push('<section class="title gut"><h1>' + esc(p.name) + '</h1><p class="variant">' + esc(p.variant) + '</p>' +
         (p.mood ? '<p class="mood">' + esc(p.mood) + '<span class="coll">' + esc(COMMON.line) + ', ' + esc(COMMON.collection) + '</span></p>' : '') +
         '<p class="desc">' + esc(p.desc) + '</p>' +
         '<nav class="idx" aria-label="제품 정보 목차">' + secs.map(function(s, i){ return '<button type="button" data-go="' + s[0] + '"><span>0' + (i + 1) + '</span>' + s[1] + '</button>'; }).join('') + '</nav></section>');
  /* 01 기본 정보 */
  h.push('<section class="sec gut" aria-labelledby="d-basic">' + secHead("01", "d-basic", "기본 정보") + '<dl class="spec">' +
         p.basics.map(function(r){ return '<div><dt>' + esc(r[0]) + '</dt><dd>' + (r[1] === TBD ? tbdCell : r[1]) + '</dd></div>'; }).join('') + '</dl></section>');
  /* 02 원료와 성분 */
  var og = p.origin, oh = '';
  if (og) {
    oh += '<p class="lead">' + esc(og.lead) + '</p>';
    if (og.card) oh += '<div class="origin"><div class="place">' + pin + '<div><strong>' + esc(o.place) + '</strong><small>' + esc(o.where) + '</small></div></div>' +
         (og.material ? '<div class="mat"><span>활용한 부산물</span><span>' + esc(og.material) + '</span></div>' : '') +
         (og.upcycle ? '<div class="mat"><span>업사이클 원료 함량</span><span>' + esc(og.upcycle) + '</span></div>' : '') +
         '<p>' + esc(o.text) + '</p></div>';
    if (og.main) oh += '<dl class="cap"><div class="wide"><dt>주원료</dt><dd>' + og.main.map(esc).join(', ') + '</dd></div></dl>';
    if (og.full) oh += '<details class="full"><summary>전성분 ' + og.full.split(', ').length + '종 보기</summary><p>' + esc(og.full) + '</p></details>';
  } else {
    oh = note("원료와 성분 정보는 확인을 마치는 대로 추가됩니다.");
  }
  oh += '<p class="fine">' + esc(COMMON.sameLineNote) + '</p>';
  h.push('<section class="sec gut" aria-labelledby="d-origin">' + secHead("02", "d-origin", "원료와 성분") + oh + '</section>');
  /* 03 포장 */
  var pk = p.pack;
  h.push('<section class="sec gut" aria-labelledby="d-pack">' + secHead("03", "d-pack", "포장") +
         (pk ? (pk.text ? '<p>' + esc(pk.text) + '</p>' : '') +
               '<dl class="cap">' + pk.items.map(function(c){ return '<div><dt>' + esc(c[0]) + '</dt><dd>' + esc(c[1]) + (c[2] ? '<small>' + esc(c[2]) + '</small>' : '') + '</dd></div>'; }).join('') +
               (pk.marks ? '<div class="wide"><dt>포장 표시 마크</dt><dd>' + esc(pk.marks) + '</dd></div>' : '') + '</dl>'
             : note("용기와 포장 소재 정보는 확인을 마치는 대로 추가됩니다.")) + '</section>');
  /* 04 사용 */
  var u = p.use;
  h.push('<section class="sec gut" aria-labelledby="d-use">' + secHead("04", "d-use", "사용") +
         '<p>' + esc(COMMON.ritualText) + '</p>' +
         '<ol class="ritual">' + STEPS.map(function(s, i){ var on = (i + 1) === p.step; return '<li' + (on ? ' class="on" aria-current="true"' : '') + '><span class="n">' + s[0] + '단계' + (on ? ', 이 제품' : '') + '</span><strong>' + s[1] + '</strong><small>' + s[2] + '</small></li>'; }).join('') + '</ol>' +
         (u ? '<h3 class="sub">사용 방법</h3><p>' + esc(u.how) + '</p>' +
              '<h3 class="sub">사용 시 주의사항</h3><ul class="caution">' + u.caution.map(function(c){ return '<li>' + esc(c) + '</li>'; }).join('') + '</ul>'
            : note("사용 방법과 사용 시 주의사항은 제품 라벨 확인을 마치는 대로 추가됩니다.")) + '</section>');
  /* 브랜드 */
  h.push('<section class="sec gut" aria-labelledby="br-h"><h2 id="br-h">브랜드</h2><p class="tag">Hidden Forest, After Shower.</p>' +
         COMMON.brandText.map(function(t){ return '<p>' + esc(t) + '</p>'; }).join('') + '</section>');
  /* 문의와 구매 */
  h.push('<section class="sec gut" aria-labelledby="b-h"><h2 id="b-h">문의와 구매</h2><div class="buy">' +
         '<a class="btn pri" href="' + COMMON.buy + '" target="_blank" rel="noopener">이든 공식몰에서 보기 ' + arrow + '</a>' +
         '<div class="mail"><span>문의 <b class="mono" id="mailAddr">' + COMMON.email + '</b></span><button class="copy" type="button" id="copyMail">주소 복사</button></div></div></section>');
  var others = PRODUCTS.filter(function(x){ return x.id !== p.id; });
  h.push('<section class="sec gut" aria-labelledby="x-h"><h2 id="x-h">같은 라인의 다른 제품</h2><div class="others">' +
         others.map(function(x){ return '<a href="#' + x.id + '"><img src="' + x.thumb + '" alt="" loading="lazy" width="480" height="480"><span>' + esc(x.name) + '</span><small>' + esc(x.variant) + '</small></a>'; }).join('') + '</div></section>');
  h.push('<footer class="foot gut"><p class="fnote">향과 무드 표현은 제품 효능을 보증하는 문구가 아닙니다.</p>정보 제공 <b>' + COMMON.seller + '</b><br>정보 기준일 ' + COMMON.asOf + '<br>제품 ID <span class="mono">' + p.id + '</span></footer>');
  return h.join('');
}
function chooseView(){
  return '<section class="choose gut" style="padding-top:12px"><h1>어떤 제품의<br><b>정보를 볼까요?</b></h1><p>HB03 Bitter Summer 컬렉션의 제품입니다. 정보를 확인할 제품을 골라 주세요.</p><ul class="list">' +
    PRODUCTS.map(function(x){ return '<li><a href="#' + x.id + '"><img src="' + x.thumb + '" alt="' + esc(x.alt) + '" width="480" height="480"><strong>' + esc(x.name) + '</strong><small>' + esc(x.variant) + '</small></a></li>'; }).join('') +
    '</ul></section><footer class="foot gut">정보 제공 <b>' + COMMON.seller + '</b></footer>';
}
function currentId(){
  var id = (location.hash || "").replace(/^#/, "");
  if (!id) { try { id = new URLSearchParams(location.search).get("pid") || ""; } catch (e) {} }
  return id;
}
var view = document.getElementById("view"), toast = document.getElementById("toast"), tt;
function render(){
  var id = currentId(), p = null;
  for (var i = 0; i < PRODUCTS.length; i++) if (PRODUCTS[i].id === id) p = PRODUCTS[i];
  view.innerHTML = p ? productView(p) : chooseView();
  document.title = p ? p.name + " " + p.variant + " | 이든 제품 정보" : "이든 제품 정보";
  window.scrollTo(0, 0);
  /* 목차: 주소의 # 은 제품 ID 라서 링크 대신 버튼으로 이동 */
  [].forEach.call(view.querySelectorAll("[data-go]"), function(btn){
    btn.addEventListener("click", function(){
      var t = document.getElementById(btn.getAttribute("data-go"));
      if (t) t.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
    });
  });
  var b = document.getElementById("copyMail");
  if (b) b.addEventListener("click", function(){
    var t = COMMON.email, done = function(ok){ toast.textContent = ok ? "주소를 복사했습니다" : "주소를 길게 눌러 복사해 주세요"; toast.hidden = false; clearTimeout(tt); tt = setTimeout(function(){ toast.hidden = true; }, 2000); };
    try { navigator.clipboard.writeText(t).then(function(){ done(true); }, function(){ selectMail(); done(false); }); } catch (e) { selectMail(); done(false); }
  });
}
function selectMail(){ var el = document.getElementById("mailAddr"); if (!el) return; var r = document.createRange(); r.selectNodeContents(el); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }
window.addEventListener("hashchange", render);
render();
</script>
</body>
